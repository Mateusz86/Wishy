name: wishy
description: Offline-first family wishlist and budget tracker.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  sqflite: ^2.4.1
  path: ^1.9.1
  path_provider: ^2.1.5
  image_picker: ^1.1.2
  google_mobile_ads: ^9.1.0
  intl: ^0.20.3
  geolocator: ^14.0.3
  url_launcher: ^6.3.2
  google_fonts: ^8.2.1
  shared_preferences: ^2.5.5
  purchases_flutter: ^10.13.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icon.png
